[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-rag-system"
version = "0.1.0"
description = "Production-grade RAG system with hybrid retrieval, reranking, evaluation, and observability"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",      # file upload support

    # Data validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # ML / Embeddings / Reranking (local models)
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",                 # CPU build is fine; GPU detected automatically
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",

    # Document parsing
    "pypdf>=5.0.0",                 # PDF parsing (pure-python, no binary deps)
    "python-docx>=1.1.0",           # Word document support

    # Vector database
    "qdrant-client>=1.12.0",

    # BM25 retrieval
    "rank-bm25>=0.2.2",

    # LLM generation (OpenAI-compatible client works for Groq/Gemini)
    "openai>=1.51.0",

    # Caching
    "redis>=5.1.0",

    # Observability / tracing
    "langfuse>=2.50.0",

    # Structured logging
    "structlog>=24.4.0",
    "rich>=13.8.0",                 # Pretty console output for structlog

    # Rate limiting
    "slowapi>=0.1.9",
    "limits>=3.13.0",

    # HTTP utilities
    "httpx>=0.27.0",
    "tenacity>=9.0.0",             # Retry logic with exponential backoff
]

[dependency-groups]
# uv dev group — installed with `uv sync --dev`
# These are NOT shipped in the production Docker image
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",               # TestClient for FastAPI

    # Evaluation
    "deepeval>=1.4.0",
    "ragas>=0.2.0",

    # Code quality
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",

    # Type stubs
    "types-redis>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — linter + formatter (replaces flake8, isort, black in one tool)
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear (catches real bugs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modernise Python syntax)
    "N",    # pep8-naming
    "S",    # flake8-bandit (security checks)
    "ANN",  # type annotations required
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",    # assert statements are fine in tests
    "ANN401",  # dynamically typed Any allowed for external untyped integrations
    "B008",    # FastAPI Depends/File calls in route function signatures
    "RUF001",  # allow unicode quotes/characters in docstrings
    "RUF002",  # allow unicode characters in docstrings
    "RUF003",  # allow unicode characters in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]   # relax security + annotation rules in tests
"scripts/**" = ["S", "ANN"]
"src/rag/observability/tracing.py" = ["S110"]  # intentional safe pass on tracing errors

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
# Mypy — strict type checking
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # some ML libs lack stubs
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "rank_bm25.*", "langfuse.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=src/rag",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "-v",
]
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: requires running Docker services",
    "evaluation: LLM-as-judge quality tests (slow)",
]

[tool.coverage.run]
source = ["src/rag"]
omit = ["tests/*", "scripts/*"]
