# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every pull request and push to main
#
# CONCEPT: Continuous Integration means every code change automatically runs
# a suite of checks before it can be merged. This enforces quality standards
# without relying on humans to remember to run tests manually.
#
# Why GitHub Actions?
#   - Free for public repos (unlimited minutes)
#   - YAML-based, version-controlled alongside the code
#   - Large ecosystem of pre-built actions
#   - Matrix builds (test on multiple Python versions) are easy
#
# Pipeline stages (in order):
#   1. lint-and-format: ruff checks (fastest, fails fast)
#   2. type-check: mypy strict type analysis
#   3. unit-tests: pytest unit tests (no external deps, fast)
#   4. docker-build: verify the Docker image builds cleanly
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit is pushed.
# This prevents wasted CI minutes on stale PR commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Job 1: Lint and Format Check ─────────────────────────────────────────────
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv is much faster than pip for CI — installs in seconds
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Ruff lint check
        run: uv run ruff check src/ tests/ scripts/
        # Ruff exits non-zero if any lint rules are violated → CI fails

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ scripts/
        # --check mode: exits non-zero if files would be reformatted

  # ── Job 2: Type Checking ──────────────────────────────────────────────────────
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run mypy
        run: uv run mypy src/
        # mypy with strict=true in pyproject.toml enforces full type coverage

  # ── Job 3: Unit Tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit/ -m unit --no-header -q
        # -q: quiet mode (less noise in CI logs)
        # -m unit: only run tests marked with @pytest.mark.unit
        # These tests have no external dependencies — no Docker needed

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()   # upload even if tests fail (useful for debugging)
        with:
          file: coverage.xml
          fail_ci_if_error: false  # don't fail CI if Codecov is down

  # ── Job 4: Integration & Evaluation Tests ────────────────────────────────────
  integration-and-eval-tests:
    name: Integration & Quality Gate Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run integration tests
        run: uv run pytest tests/integration/ -m integration --no-header -q

      - name: Run evaluation tests (quality gates)
        run: uv run pytest tests/evaluation/ -m evaluation --no-header -q

  # ── Job 5: Docker Build Verification ─────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, unit-tests, integration-and-eval-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx enables BuildKit features: layer caching, multi-platform builds

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false        # don't push — just verify the build succeeds
          tags: rag-system:ci-test
          cache-from: type=gha    # GitHub Actions cache for Docker layers
          cache-to: type=gha,mode=max
          # Layer caching makes subsequent builds ~10x faster in CI
